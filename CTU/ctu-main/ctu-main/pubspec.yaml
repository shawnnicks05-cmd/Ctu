name: ctu_smartsched
description: CTU SmartSched - Student Smart Calendar System - Plan Smart. Stay Connected.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  table_calendar: ^3.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.2
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  animate_do: ^3.3.4
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  firebase_analytics: ^10.8.0
  cloud_firestore: ^4.15.8
  timezone: ^0.9.2
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"